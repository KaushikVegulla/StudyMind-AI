name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Backend tests
        # EMBEDDINGS_BACKEND=none: the suite mocks or skips the real
        # embedding runtimes, so CI never downloads a model.
        env:
          EMBEDDINGS_BACKEND: none
        run: python -m pytest backend/tests -q
      - name: Retrieval evaluation harness
        # STUDY_MIND_EVAL_OFFLINE=1 forces the hashing fallback
        # embedder: real pipeline, no model download, no API keys.
        env:
          STUDY_MIND_EVAL_OFFLINE: "1"
        run: python backend/eval/run_eval.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
